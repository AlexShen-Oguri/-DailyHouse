<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#47704e" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('dailyhouse-theme') === 'night' ? 'night' : 'day';
        document.documentElement.lang = localStorage.getItem('dailyhouse-language') === 'en' ? 'en' : 'zh-CN';
        document.documentElement.dataset.language = document.documentElement.lang === 'en' ? 'en' : 'zh';
      } catch (_) { document.documentElement.dataset.theme = 'day'; }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="日常小院，一张属于你的本地个人工作桌。待办、阅读、笔记与收支，有序生长。" />
    <title>日常小院 · 个人工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
