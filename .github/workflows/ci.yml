name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend install, test and build
        working-directory: backend
        run: npm ci && npm audit --audit-level=moderate && npm test && npm run build
      - name: Frontend install, test and build
        working-directory: frontend
        run: npm ci && npm audit --audit-level=moderate && npm test && npm run build
      - name: Launcher and import CLI tests
        run: node --test scripts/reading-import.test.mjs scripts/macos-workbench.test.mjs
